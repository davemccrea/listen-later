services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 13378:80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      # Hardlinks made by the qBittorrent completion script; the bytes are shared
      # with the seeding torrents, so this costs no extra disk.
      - ../qbittorrent/downloads/_library/audiobooks:/audiobooks
    environment:
      - TZ=Europe/Helsinki
    restart: unless-stopped
    user: 1000:1000
