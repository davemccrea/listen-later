services:
  tailscale-beszel:
    image: ghcr.io/tailscale/tailscale:latest
    container_name: tailscale-beszel
    hostname: beszel
    env_file: ../.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false --netfilter-mode=off
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Keep the hub reachable on the host loopback so the host-mode
    # beszel-agent (HUB_URL=http://localhost:8090) can still connect.
    ports:
      - "127.0.0.1:8090:8090"
      - "192.168.1.102:8090:8090"
    restart: unless-stopped

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    volumes:
      - ./data:/beszel_data
    network_mode: service:tailscale-beszel
    depends_on:
      - tailscale-beszel
    restart: unless-stopped
