services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    volumes:
      - ./data:/beszel_data
    networks:
      - proxy
    # Keep the hub reachable on the host loopback so the host-mode
    # beszel-agent (HUB_URL=http://localhost:8090) can still connect.
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILryqU32NmaM3C9bLUnibocGiR2YwYdtxtXLePcfcWVs'
      TOKEN: aece19f1-f595-49f1-be7e-3b17a024e819
      HUB_URL: http://127.0.0.1:8090

networks:
  proxy:
    name: proxy
    external: true
