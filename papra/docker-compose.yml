services:
  papra:
    image: ghcr.io/papra-hq/papra:latest
    container_name: papra
    restart: unless-stopped
    user: 1000:1000
    env_file: .env
    environment:
      - TZ=Europe/Helsinki
      - APP_BASE_URL=https://papra.internal.mccrea.link
      - INGESTION_FOLDER_IS_ENABLED=true
    volumes:
      - ./app-data:/app/app-data
      - ./ingestion:/app/ingestion
    ports:
      - "192.168.1.102:1221:1221"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1221/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
