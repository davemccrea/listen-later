services:
  tsidp:
    image: ghcr.io/tailscale/tsidp:latest
    container_name: tsidp
    user: "0:0"
    env_file: .env
    environment:
      - TAILSCALE_USE_WIP_CODE=1
      - TS_HOSTNAME=tsidp
      - TS_STATE_DIR=/data
      - TSIDP_ENABLE_STS=1
      - TSIDP_LOCAL_PORT=8080
      - TSIDP_DEBUG_ALL_REQUESTS=1
    volumes:
      - ./data:/data
    networks:
      default: {}
      shared:
        aliases:
          - tsidp.tailfab2f.ts.net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tsidp-nginx
    network_mode: "service:tsidp"
    volumes:
      - ./data:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tsidp
    restart: unless-stopped

networks:
  default:
  shared:
    name: homelab
    external: true
