services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./config:/config
      - /opt/stacks/shared/downloads:/downloads
      - /mnt/Media/Movies:/movies
    networks:
      - proxy
    restart: always

networks:
  proxy:
    name: proxy
    external: true
