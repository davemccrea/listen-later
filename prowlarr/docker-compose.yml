services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./config:/config
    ports:
      - 8203:9696
    labels:
      tsdproxy.enable: "true"
      tsdproxy.port.1: "443/https:8203/http"
    restart: always
