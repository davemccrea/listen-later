services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    hostname: freshrss
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    ports:
      - "192.168.1.102:8084:80"
    environment:
      TZ: Europe/Helsinki
      CRON_MIN: '3,33'
      # cloudflared reaches us over the compose network (172.16.0.0/12).
      TRUSTED_PROXY: 172.16.0.1/12 192.168.0.1/16
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3

  tunnel:
    container_name: freshrss-tunnel
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    depends_on:
      - freshrss
    env_file: .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
