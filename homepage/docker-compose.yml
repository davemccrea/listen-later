services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.internal.mccrea.link,192.168.1.102:3000
      PUID: 1000
      PGID: 1000
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config
    network_mode: host
    restart: always
