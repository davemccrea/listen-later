services: 
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./config:/config
      - /opt/stacks/shared/downloads:/downloads
      - /mnt/Media/TV:/tv
    labels:
      tsdproxy.enable: "true"
      tsdproxy.port.1: "443/https:8989/http"
    networks:
      - default
      - shared
    restart: always

networks:
  default:
  shared:
    name: homelab
    external: true
