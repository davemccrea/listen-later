name: caddy

services:
  # Single ingress tailnet node. Caddy shares this netns, so it gets the
  # tailnet IP (what AdGuard points *.mccrea.link at) AND, because this sidecar
  # is attached to the `proxy` bridge, it can reach every backend container by
  # name via Docker's embedded resolver (127.0.0.11).
  #
  # TS_ACCEPT_DNS=false is deliberate: we do NOT want tailscaled to rewrite
  # resolv.conf to 100.100.100.100 in this netns. Caddy only needs to resolve
  # (a) backend container names -> Docker 127.0.0.11, and (b) public names for
  # the ACME DNS-01 challenge -> Docker forwards those upstream. Nothing here
  # ever needs to resolve a ts.net name.
  tailscale-caddy:
    image: ghcr.io/tailscale/tailscale:latest
    container_name: tailscale-caddy
    hostname: caddy
    env_file: ../.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    networks:
      - proxy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  caddy:
    build: .
    image: caddy-cloudflare:local
    container_name: caddy
    env_file: .env
    network_mode: service:tailscale-caddy
    depends_on:
      - tailscale-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
    restart: unless-stopped

  # Forward-auth endpoint for the weak-auth UIs (sonarr/radarr/prowlarr/sabnzbd).
  # Lives on the proxy bridge so Caddy can reach it by name. See README for the
  # tsidp client registration and the ts.net back-channel caveat that must be
  # resolved before this is functional.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    # Dormant until the forward-auth phase. Start with:
    #   docker compose --profile auth up -d
    profiles: ["auth"]
    env_file: .env
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # One cookie shared across every *.mccrea.link host so a single login
      # covers all guarded services.
      OAUTH2_PROXY_COOKIE_DOMAINS: .mccrea.link
      OAUTH2_PROXY_WHITELIST_DOMAINS: .mccrea.link
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # forward-auth only: no upstream of its own
      OAUTH2_PROXY_UPSTREAMS: static://200
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    name: proxy
    external: true
