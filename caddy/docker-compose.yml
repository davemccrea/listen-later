name: caddy

services:
  # Caddy shares this Tailscale netns; keep DNS on Docker's resolver so backend
  # container names and ACME DNS-01 lookups both resolve correctly.
  tailscale-caddy:
    image: ghcr.io/tailscale/tailscale:latest
    container_name: tailscale-caddy
    hostname: caddy
    env_file: ../.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    networks:
      - proxy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  caddy:
    build: .
    image: caddy-cloudflare:local
    container_name: caddy
    # Drop to a non-root uid. The caddy binary has cap_net_bind_service=ep, so
    # it can still bind 443 in the shared netns without root.
    user: "1000:1000"
    env_file: .env
    network_mode: service:tailscale-caddy
    depends_on:
      - tailscale-caddy
    volumes:
      # Mount the directory so in-place Caddyfile edits are visible.
      - ./conf:/etc/caddy:ro
      - ./data:/data
      - ./config:/config
    restart: unless-stopped

networks:
  proxy:
    name: proxy
    external: true
