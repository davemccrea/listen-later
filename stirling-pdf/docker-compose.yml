services:
  tailscale-stirling-pdf:
    image: ghcr.io/tailscale/tailscale:latest
    container_name: tailscale-stirling-pdf
    hostname: stirling-pdf
    env_file: ../.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    volumes:
      - ./stirling-data/tessdata:/usr/share/tessdata
      - ./stirling-data/configs:/configs
      - ./stirling-data/logs:/logs
      - ./stirling-data/pipeline:/pipeline
    environment:
      - SECURITY_ENABLELOGIN=false
      - LANGS=en_GB
    network_mode: service:tailscale-stirling-pdf
    depends_on:
      - tailscale-stirling-pdf
    restart: unless-stopped
