services:  
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./config:/config
      - /opt/stacks/shared/downloads:/downloads
      - /opt/stacks/shared/incomplete-downloads:/incomplete-downloads
    ports:
      - 8080:8080
    labels:
      tsdproxy.enable: "true"
      tsdproxy.port.1: "443/https:8080/http"
    networks:
      - default
      - shared
    restart: always

networks:
  default:
  shared:
    name: homelab
    external: true
