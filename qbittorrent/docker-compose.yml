services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
      - WEBUI_PORT=8081
      - TORRENTING_PORT=51413
    volumes:
      - ./config:/config
      - ./downloads:/downloads #optional
      - ./scripts:/scripts:ro
      # NB: the CWA ingest folder and the Audiobookshelf library live *inside*
      # ./downloads on purpose. Hardlinks cannot cross mount points, even when
      # both sides are the same host filesystem, so everything the completion
      # script links between has to sit under this one bind mount.
    ports:
      - "192.168.1.102:8081:8081"
      - 51413:51413
      - 51413:51413/udp
    stop_grace_period: "10s" #optional
    restart: unless-stopped
